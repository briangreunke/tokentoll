[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokentoll"
version = "0.1.0"
description = "TokenToll API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokentoll"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tokentoll",
    "pyproject.toml",
    "alembic.ini",
    "alembic",
    "tests",
    "AGENTS.md",
    "Makefile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
